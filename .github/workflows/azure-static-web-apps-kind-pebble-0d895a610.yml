name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build explicitly ourselves rather than relying on Azure/static-web-apps-deploy's
      # automatic Oryx build detection, which silently skipped the build entirely and
      # deployed raw unbuilt source (/src/main.tsx) instead of the compiled dist/ output.
      - name: Install dependencies and build frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://inventory-order-system-api-cheong-deavayc8drbff0d2.southeastasia-01.azurewebsites.net
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_0D895A610 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "frontend/dist" # Already-built output — deploy this directly.
          api_location: ""
          output_location: "" # Nothing further to build; app_location IS the built output.
          skip_app_build: true # We built it ourselves above; don't let Oryx try (and silently skip) again.
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_0D895A610 }}
          action: "close"
